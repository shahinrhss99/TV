<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NIS TV Pro | M3U8 Player</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c15;
            color: #edeef7;
            padding: 20px;
        }

        .app-container {
            max-width: 1500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid #2c2f42;
            padding-bottom: 15px;
        }

        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #b6a2ff, #6080ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .reset-btn {
            background: #1f2235;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: #ff9e8f;
            cursor: pointer;
            font-weight: 500;
        }

        /* two columns */
        .dashboard {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* left panel (add sources) */
        .add-panel {
            flex: 0 0 320px;
            background: #0f1220;
            border-radius: 28px;
            padding: 1.4rem;
            border: 1px solid #292e44;
        }

        .add-panel h3 {
            font-size: 1.2rem;
            margin: 0 0 1rem 0;
            border-left: 4px solid #5e7bff;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #9aa3c7;
            display: block;
            margin-bottom: 6px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            background: #181c2b;
            border: 1px solid #2f354c;
            padding: 10px 12px;
            border-radius: 24px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin: 12px 0;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: linear-gradient(90deg, #5263ff, #8a4eff);
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-secondary {
            background: #22263d;
            border: 1px solid #42486b;
            width: 100%;
            border-radius: 40px;
            padding: 9px;
            cursor: pointer;
            color: #cdd6ff;
        }

        hr {
            margin: 20px 0;
            border-color: #2a2f47;
        }

        .small-note {
            font-size: 0.7rem;
            color: #7b83aa;
            text-align: center;
            margin-top: 15px;
        }

        /* right panel */
        .content-panel {
            flex: 1;
            min-width: 280px;
        }

        /* video player */
        .video-area {
            background: black;
            border-radius: 28px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #2f354c;
        }

        video {
            width: 100%;
            max-height: 520px;
            display: block;
        }

        .player-info {
            background: #0e111d;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #292e44;
        }

        .now-playing {
            font-weight: 500;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .quality-select {
            background: #1e2235;
            border: none;
            border-radius: 30px;
            padding: 5px 12px;
            color: white;
        }

        /* channels header */
        .channels-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px 0;
            flex-wrap: wrap;
        }

        .search-box {
            background: #11141f;
            border-radius: 40px;
            padding: 5px 16px;
            display: flex;
            gap: 8px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .cat-item {
            background: #171b2b;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .cat-item.active {
            background: #5e7bff;
            color: white;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            max-height: 500px;
            overflow-y: auto;
            padding: 4px;
        }

        .channel-card {
            background: #11141f;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            cursor: pointer;
            border: 1px solid #262b42;
            transition: 0.2s;
        }

        .channel-card:hover {
            background: #1a1e30;
            border-color: #5e7bff;
            transform: translateY(-2px);
        }

        .channel-logo {
            width: 48px;
            height: 48px;
            background: #232842;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .channel-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .channel-group {
            font-size: 0.65rem;
            color: #9aa2c9;
        }

        .empty-msg {
            text-align: center;
            padding: 40px;
            color: #6c729d;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px solid #262b42;
            font-size: 0.7rem;
            color: #6d749b;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e233b;
            backdrop-filter: blur(8px);
            padding: 8px 24px;
            border-radius: 60px;
            font-size: 0.8rem;
            z-index: 999;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo">
            <h1>NIS TV Pro <span style="font-size:0.8rem;">⚡ Built-in Playlist</span></h1>
        </div>
        <button id="resetDefaultBtn" class="reset-btn"><i class="fas fa-database"></i> Restore Default Playlist</button>
    </div>

    <div class="dashboard">
        <!-- LEFT: Add Sources (optional) -->
        <div class="add-panel">
            <h3><i class="fas fa-plus-circle"></i> Add Sources</h3>
            <div class="input-group">
                <label><i class="fas fa-link"></i> M3U Playlist URL</label>
                <input type="text" id="m3uUrlInput" placeholder="https://example.com/playlist.m3u">
                <div class="radio-group">
                    <label><input type="radio" name="mergeMode" value="replace" checked> Replace</label>
                    <label><input type="radio" name="mergeMode" value="merge"> Merge</label>
                </div>
                <button id="fetchUrlBtn" class="btn-primary"><i class="fas fa-cloud-download-alt"></i> Fetch & Add</button>
            </div>
            <div class="input-group">
                <label><i class="fas fa-upload"></i> Local .m3u File</label>
                <input type="file" id="m3uFileInput" accept=".m3u,.m3u8,.txt" style="display:none">
                <button id="chooseFileBtn" class="btn-secondary"><i class="fas fa-folder-open"></i> Choose File</button>
            </div>
            <hr>
            <h3><i class="fas fa-plus"></i> Add Single Channel</h3>
            <div class="input-group">
                <input type="text" id="chName" placeholder="Channel Name">
                <input type="text" id="chUrl" placeholder="Stream URL (.m3u8 or .mp4)">
                <input type="text" id="chGroup" placeholder="Category (e.g. Bangla)">
                <input type="text" id="chLogo" placeholder="Logo URL or emoji" maxlength="50">
                <button id="addChannelBtn" class="btn-primary"><i class="fas fa-save"></i> Save Channel</button>
            </div>
            <div class="small-note">
                <i class="fas fa-info-circle"></i> 200+ channels preloaded from your M3U list. Use "Restore Default" to get them back.
            </div>
        </div>

        <!-- RIGHT: Player + Channels -->
        <div class="content-panel">
            <div class="video-area">
                <video id="videoPlayer" controls poster="https://placehold.co/1920x540/0e1122/5e7bff?text=NIS+TV+Pro"></video>
                <div class="player-info">
                    <div class="now-playing"><i class="fas fa-tv"></i> <span id="currentChannelLabel">No channel</span></div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <i class="fas fa-chart-line"></i> <select id="qualitySelect" class="quality-select" disabled><option>Auto quality</option></select>
                    </div>
                </div>
            </div>

            <div class="channels-header">
                <div><i class="fas fa-list"></i> <strong>My Channels</strong> <span id="totalChannels">(0)</span></div>
                <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search..."></div>
            </div>
            <div id="categoriesList" class="categories"></div>
            <div id="channelsGrid" class="channels-grid">
                <div class="empty-msg"><i class="fas fa-spinner fa-pulse"></i> Loading channels...</div>
            </div>
        </div>
    </div>
    <div class="footer">All Rights Reserved. NIS TV Pro-2026 | All channels from your provided M3U playlist (direct playback)</div>
</div>

    const chName = document.getElementById('chName');
    const chUrl = document.getElementById('chUrl');
    const chGroup = document.getElementById('chGroup');
    const chLogo = document.getElementById('chLogo');

    const STORAGE_KEY = "nistvpro_custom_channels";

    function showToast(msg, duration = 2500) {
        let t = document.getElementById('toastMessage');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', duration);
    }

    // destroy HLS
    function destroyPlayer() {
        if (currentHls) {
            currentHls.destroy();
            currentHls = null;
        }
        video.pause();
        video.removeAttribute('src');
        video.load();
        qualitySelect.disabled = true;
        qualitySelect.innerHTML = '<option>Auto quality</option>';
    }

    // play channel using HLS.js
    function playChannel(ch) {
        if (!ch || !ch.url) return;
        destroyPlayer();
        currentChannelSpan.innerText = ch.name;
        const streamUrl = ch.url.trim();

        const setQualityOptions = (levels) => {
            if (levels && levels.length > 1) {
                qualitySelect.disabled = false;
                qualitySelect.innerHTML = '<option value="auto">Auto (Best)</option>';
                levels.forEach((lvl, idx) => {
                    let label = lvl.height ? `${lvl.height}p` : `${Math.round(lvl.bitrate / 1000)}k`;
                    qualitySelect.innerHTML += `<option value="${idx}">${label}</option>`;
                });
                qualitySelect.onchange = () => {
                    if (currentHls) currentHls.currentLevel = qualitySelect.value === 'auto' ? -1 : parseInt(qualitySelect.value);
                };
            } else {
                qualitySelect.disabled = true;
                qualitySelect.innerHTML = '<option>Auto (No variants)</option>';
            }
        };

        if (streamUrl.includes('.m3u8') || streamUrl.endsWith('m3u8')) {
            if (Hls.isSupported()) {
                const hls = new Hls({ debug: false });
                currentHls = hls;
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    setQualityOptions(hls.levels);
                    video.play().catch(e => showToast("Autoplay blocked, click play", 1500));
                });
                hls.on(Hls.Events.ERROR, (_, err) => {
                    if (err.fatal) showToast("Stream error", 2000);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play().catch(()=>{});
                qualitySelect.disabled = true;
            } else showToast("HLS not supported");
        } else {
            video.src = streamUrl;
            video.play().catch(()=>showToast("Playback error"));
            qualitySelect.disabled = true;
        }
    }

    // get logo display (image or fallback text)
    function getLogoDisplay(ch) {
        if (ch.logo && ch.logo.match(/^https?:\/\//i)) return `url('${ch.logo}')`;
        if (ch.logo && ch.logo.trim()) return ch.logo;
        let first = ch.name.charAt(0).toUpperCase();
        return /[A-Z0-9]/.test(first) ? first : "📺";
    }

    // render UI
    function renderUI() {
        totalSpan.innerText = `(${allChannels.length})`;
        // build categories map
        let groups = new Map();
        groups.set('all', allChannels.length);
        allChannels.forEach(ch => { let g = ch.group || "Uncategorized"; groups.set(g, (groups.get(g)||0)+1); });
        let sorted = Array.from(groups.keys()).filter(k=>k!=='all').sort();
        if (groups.has('all')) sorted.unshift('all');
        let catHtml = '';
        sorted.forEach(cat => {
            let activeClass = activeCategory === cat ? 'active' : '';
            catHtml += `<div class="cat-item ${activeClass}" data-cat="${cat}">${cat==='all'?'All':cat} (${groups.get(cat)})</div>`;
        });
        categoriesDiv.innerHTML = catHtml;
        document.querySelectorAll('.cat-item').forEach(el => {
            el.addEventListener('click', () => { activeCategory = el.dataset.cat; renderUI(); });
        });

        let filtered = allChannels.filter(ch => {
            if (activeCategory !== 'all' && (ch.group||"Uncategorized") !== activeCategory) return false;
            if (searchText.trim() && !ch.name.toLowerCase().includes(searchText.toLowerCase())) return false;
            return true;
        });

        if (filtered.length === 0) {
            channelsGridDiv.innerHTML = '<div class="empty-msg"><i class="fas fa-frown"></i> No channels match</div>';
            return;
        }
        let gridHtml = '';
        filtered.forEach(ch => {
            let logoStyle = '';
            let logoContent = '';
            if (ch.logo && ch.logo.match(/^https?:\/\//i)) {
                logoStyle = `background-image: ${getLogoDisplay(ch)}; background-size: cover;`;
                logoContent = '';
            } else {
                logoContent = getLogoDisplay(ch);
            }
            let groupShow = ch.group || "General";
            gridHtml += `
                <div class="channel-card" data-url="${escapeAttr(ch.url)}" data-name="${escapeAttr(ch.name)}" data-group="${escapeAttr(groupShow)}">
                    <div class="channel-logo" style="${logoStyle}">${logoContent}</div>
                    <div class="channel-info">
                        <div class="channel-name">${escapeHtml(ch.name)}</div>
                        <div class="channel-group"><i class="fas fa-tag"></i> ${escapeHtml(groupShow)}</div>
                    </div>
                </div>
            `;
        });
        channelsGridDiv.innerHTML = gridHtml;
        document.querySelectorAll('.channel-card').forEach(card => {
            card.addEventListener('click', () => {
                playChannel({ url: card.dataset.url, name: card.dataset.name, group: card.dataset.group });
            });
        });
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function escapeAttr(str) { return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

    // M3U parser
    function parseM3U(content) {
        const lines = content.split(/\r?\n/);
        let channels = [];
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF')) {
                let attrs = {};
                let attrRegex = /(\w+(?:-\w+)?)="([^"]*)"/g;
                let match;
                while ((match = attrRegex.exec(line)) !== null) attrs[match[1]] = match[2];
                let name = "";
                let lastComma = line.lastIndexOf(',');
                if (lastComma !== -1) name = line.substring(lastComma + 1).trim();
                if (!name && attrs['tvg-name']) name = attrs['tvg-name'];
                if (!name) name = "Unknown";
                let group = attrs['group-title'] || "Uncategorized";
                let logo = attrs['tvg-logo'] || "";
                let urlLine = "";
                let j = i + 1;
                while (j < lines.length) {
                    let nxt = lines[j].trim();
                    if (nxt && !nxt.startsWith('#')) {
                        urlLine = nxt;
                        break;
                    }
                    j++;
                }
                if (urlLine && !urlLine.includes('#KODIPROP')) {
                    channels.push({
                        id: Date.now() + '-' + Math.random() + '-' + i,
                        name: name,
                        url: urlLine,
                        group: group,
                        logo: logo || ""
                    });
                }
                i = j;
            }
        }
        return channels;
    }

    // load default channels from hardcoded M3U
    function loadDefaultChannels() {
        const channels = parseM3U(DEFAULT_M3U_CONTENT);
        allChannels = channels;
        persistChannels();
        showToast(`Loaded ${channels.length} channels from built-in playlist`, 2000);
        renderUI();
    }

    // persist to localStorage
    function persistChannels() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allChannels));
    }

    // reset to default
    function resetToDefault() {
        if (confirm("Restore original playlist? All manually added channels will be lost.")) {
            loadDefaultChannels();
        }
    }

    // add single channel
    function addSingleChannel() {
        let name = chName.value.trim();
        let url = chUrl.value.trim();
        let group = chGroup.value.trim() || "General";
        let logo = chLogo.value.trim();
        if (!name || !url) { showToast("Name and URL required"); return; }
        if (!url.startsWith('http')) { showToast("URL must start with http/https"); return; }
        allChannels.push({
            id: Date.now() + '-' + Math.random(),
            name, url, group, logo
        });
        persistChannels();
        chName.value = chUrl.value = chGroup.value = chLogo.value = "";
        renderUI();
        showToast(`Added ${name}`, 1500);
    }

    // fetch external M3U
    async function fetchCustomM3U() {
        let url = m3uUrlInput.value.trim();
        if (!url) { showToast("Enter playlist URL"); return; }
        try {
            let res = await fetch(url);
            if (!res.ok) throw new Error();
            let txt = await res.text();
            let channels = parseM3U(txt);
            let mergeMode = document.querySelector('input[name="mergeMode"]:checked').value;
            if (mergeMode === 'merge') {
                let existingUrls = new Set(allChannels.map(c => c.url));
                let added = channels.filter(c => !existingUrls.has(c.url));
                allChannels = [...allChannels, ...added];
                showToast(`Merged ${added.length} channels`);
            } else {
                allChannels = channels;
                showToast(`Replaced with ${channels.length} channels`);
            }
            persistChannels();
            renderUI();
        } catch(e) { showToast("Failed to fetch URL (CORS?)"); }
    }

    // load local file
    function loadLocalFile(file) {
        let reader = new FileReader();
        reader.onload = e => {
            let channels = parseM3U(e.target.result);
            let mergeMode = document.querySelector('input[name="mergeMode"]:checked').value;
            if (mergeMode === 'merge') {
                let existingUrls = new Set(allChannels.map(c => c.url));
                let added = channels.filter(c => !existingUrls.has(c.url));
                allChannels = [...allChannels, ...added];
                showToast(`Merged ${added.length} channels`);
            } else {
                allChannels = channels;
                showToast(`Loaded ${channels.length} channels`);
            }
            persistChannels();
            renderUI();
        };
        reader.readAsText(file);
    }

    // initial load
    function init() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                allChannels = JSON.parse(stored);
                if (allChannels.length === 0) loadDefaultChannels();
                else renderUI();
            } catch(e) { loadDefaultChannels(); }
        } else {
            loadDefaultChannels();
        }
    }

    // event listeners
    resetDefaultBtn.addEventListener('click', resetToDefault);
    fetchUrlBtn.addEventListener('click', fetchCustomM3U);
    chooseFileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { if(e.target.files.length) loadLocalFile(e.target.files[0]); e.target.value=''; });
    addChannelBtn.addEventListener('click', addSingleChannel);
    searchInput.addEventListener('input', (e) => { searchText = e.target.value; renderUI(); });

    init();
</script>
</body>
</html>
