<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>NIS TV Pro | M3U8 Playlist Manager</title>
    <!-- Google Font & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- HLS.js core -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #05070f;
            color: #edf2ff;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1a1e2c; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #5b6cff; border-radius: 10px; }

        .app {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1rem 1.5rem 1.5rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #23263b;
            padding-bottom: 0.8rem;
        }
        .logo h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(130deg, #b388ff, #5c6eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .logo span {
            font-size: 0.75rem;
            background: #1e2133;
            padding: 4px 10px;
            border-radius: 30px;
            margin-left: 8px;
            font-weight: 400;
            color: #a9b5e6;
        }
        .reset-btn {
            background: #2a2e45;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: #ffb4a2;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .reset-btn:hover { background: #3e2a3b; color: #ff8a7a; }

        /* two columns */
        .two-columns {
            display: flex;
            gap: 1.8rem;
            flex-wrap: wrap;
            flex: 1;
        }
        /* LEFT SIDE : Add panel */
        .add-sidebar {
            flex: 0 0 300px;
            background: #0c0f1a;
            border-radius: 28px;
            padding: 1.2rem 1rem;
            border: 1px solid #282d44;
            backdrop-filter: blur(4px);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .add-sidebar h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #5b6cff;
            padding-left: 12px;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            color: #8f9bb5;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            background: #11141f;
            border: 1px solid #2f334c;
            padding: 10px 12px;
            border-radius: 20px;
            color: white;
            font-size: 0.8rem;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #5b6cff;
            box-shadow: 0 0 0 2px #5b6cff40;
        }
        .radio-group {
            display: flex;
            gap: 12px;
            margin: 12px 0;
            font-size: 0.75rem;
            align-items: center;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-add {
            background: linear-gradient(95deg, #4c5eff, #7c3aed);
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            margin-top: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-secondary {
            background: #23263b;
            border: 1px solid #3d4262;
            width: 100%;
            border-radius: 40px;
            padding: 8px;
            margin-top: 8px;
            color: #cbd5ff;
            cursor: pointer;
        }
        hr {
            margin: 18px 0;
            border-color: #282e44;
        }
        .small-note {
            font-size: 0.7rem;
            color: #6c729b;
            text-align: center;
            margin-top: 12px;
        }

        /* RIGHT CONTENT */
        .main-content {
            flex: 1;
            min-width: 260px;
        }
        /* LARGE VIDEO PLAYER */
        .player-area {
            background: #000000;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px black;
            margin-bottom: 1.5rem;
            border: 1px solid #2a2f48;
        }
        video {
            width: 100%;
            max-height: 560px;
            background: #010101;
            display: block;
            outline: none;
        }
        .player-controls-bar {
            background: #0b0e17;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid #22263d;
        }
        .channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .channel-info i {
            font-size: 1.2rem;
            color: #6c7eff;
        }
        #currentChannelName {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .quality-selector {
            background: #191e2e;
            border-radius: 40px;
            padding: 4px 12px;
            border: none;
            color: white;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
        }
        /* Channels grid */
        .channels-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 1rem 0 1rem 0;
            flex-wrap: wrap;
        }
        .search-bar {
            background: #0f121f;
            border-radius: 40px;
            padding: 6px 16px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            padding: 5px;
            width: 180px;
            outline: none;
        }
        .categories-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 6px;
        }
        .cat-chip {
            background: #131725;
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            white-space: nowrap;
        }
        .cat-chip.active {
            background: #5b6cff;
            color: white;
            box-shadow: 0 2px 8px #5b6cff60;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .channel-card {
            background: #0f121f;
            border-radius: 24px;
            padding: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid #23273f;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .channel-card:hover {
            transform: translateY(-3px);
            background: #181e30;
            border-color: #5b6cff;
        }
        .channel-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #2a2f4a, #1a1f36);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.4rem;
            color: white;
            text-transform: uppercase;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .channel-details {
            flex: 1;
            overflow: hidden;
        }
        .channel-name {
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-group {
            font-size: 0.65rem;
            color: #8c95c2;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 5px;
        }
        .empty-message {
            text-align: center;
            padding: 3rem;
            color: #6e759b;
        }
        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e243f;
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 10px 24px;
            z-index: 999;
            font-size: 0.8rem;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        /* ফুটার */
        .footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            border-top: 1px solid #23263b;
            font-size: 0.75rem;
            color: #7d85b3;
        }
        @media (max-width: 850px) {
            .app { padding: 1rem; }
            .add-sidebar { flex: auto; width: 100%; position: static; }
            .two-columns { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <h1>NIS TV Pro <span>M3U8 Hub</span></h1>
        </div>
        <button id="resetStorageBtn" class="reset-btn"><i class="fas fa-database"></i> Reset All Data</button>
    </div>

    <div class="two-columns">
        <!-- LEFT PANEL: যোগ করার ব্যবস্থা + লোগো সিস্টেম -->
        <div class="add-sidebar">
            <h3><i class="fas fa-plus-circle"></i> Add Sources</h3>
            <div class="input-group">
                <label><i class="fas fa-globe"></i> M3U Playlist URL</label>
                <input type="text" id="m3uUrlInput" placeholder="https://example.com/playlist.m3u">
                <div class="radio-group">
                    <label><input type="radio" name="mergeModeRadio" value="replace" checked> Replace</label>
                    <label><input type="radio" name="mergeModeRadio" value="merge"> Merge</label>
                </div>
                <button id="fetchM3uBtn" class="btn-add"><i class="fas fa-cloud-download-alt"></i> Fetch & Add</button>
            </div>
            <div class="input-group">
                <label><i class="fas fa-upload"></i> Local .m3u File</label>
                <input type="file" id="fileUploader" accept=".m3u,.m3u8,.txt" style="display:none">
                <button id="triggerFileBtn" class="btn-secondary"><i class="fas fa-folder-open"></i> Choose File</button>
            </div>
            <hr>
            <h3><i class="fas fa-link"></i> Add Single Channel</h3>
            <div class="input-group">
                <input type="text" id="singleName" placeholder="Channel Name (e.g., BTV)">
                <input type="text" id="singleUrl" placeholder="Stream URL (.m3u8 or .mp4)">
                <input type="text" id="singleGroup" placeholder="Category (e.g., Bangla, Sports)">
                <div class="input-group">
                    <label>Logo (Emoji or 1-2 letters)</label>
                    <input type="text" id="singleLogo" placeholder="📺  or  B" maxlength="2" style="text-align:center">
                </div>
                <button id="addSingleBtn" class="btn-add"><i class="fas fa-save"></i> Save Channel</button>
            </div>
            <div class="small-note">
                <i class="fas fa-info-circle"></i> লোগো: ইমোজি বা অক্ষর দিন। খালি থাকলে নামের প্রথম অক্ষর auto.
            </div>
        </div>

        <!-- RIGHT MAIN AREA -->
        <div class="main-content">
            <!-- বড় ভিডিও প্লেয়ার -->
            <div class="player-area">
                <video id="videoPlayer" controls poster="https://placehold.co/1920x600/0a0c18/5b6cff?text=NIS+TV+Pro"></video>
                <div class="player-controls-bar">
                    <div class="channel-info">
                        <i class="fas fa-tower-broadcast"></i>
                        <span id="currentChannelName">— No channel —</span>
                    </div>
                    <div id="qualityWrapper" style="display: flex; gap: 8px; align-items: center;">
                        <i class="fas fa-hdd"></i>
                        <select id="qualitySelect" class="quality-selector" disabled>
                            <option value="auto">Auto Quality</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- চ্যানেল হেডার ও সার্চ -->
            <div class="channels-header">
                <div><i class="fas fa-list-ul"></i> <strong>My Channels</strong> <span id="totalCountBadge">(0)</span></div>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchChannelInput" placeholder="Search channel...">
                </div>
            </div>
            <!-- ক্যাটাগরি চিপস -->
            <div id="categoriesContainer" class="categories-row"></div>
            <!-- চ্যানেল গ্রিড -->
            <div id="channelsGrid" class="channels-grid">
                <div class="empty-message"><i class="fas fa-tv fa-3x"></i><br>No channels. Add playlist or single channel from left panel.</div>
            </div>
        </div>
    </div>
    <div class="footer">
        All Rights Reserved. NIS TV Pro-2026
    </div>
</div>
<div id="toastMsg" class="toast" style="display: none;"></div>

<script>
    // ---------- GLOBAL STATE ----------
    let allChannels = [];      // { id, name, url, group, logo }
    let activeCategory = "all";
    let searchKeyword = "";
    let currentHlsInstance = null;
    let currentQualityLevels = [];

    // DOM elements
    const video = document.getElementById('videoPlayer');
    const currentNameSpan = document.getElementById('currentChannelName');
    const categoriesContainer = document.getElementById('categoriesContainer');
    const channelsGrid = document.getElementById('channelsGrid');
    const searchInput = document.getElementById('searchChannelInput');
    const resetBtn = document.getElementById('resetStorageBtn');
    const fetchM3uBtn = document.getElementById('fetchM3uBtn');
    const triggerFileBtn = document.getElementById('triggerFileBtn');
    const fileUploader = document.getElementById('fileUploader');
    const addSingleBtn = document.getElementById('addSingleBtn');
    const qualitySelect = document.getElementById('qualitySelect');
    const m3uUrlInput = document.getElementById('m3uUrlInput');
    const singleName = document.getElementById('singleName');
    const singleUrl = document.getElementById('singleUrl');
    const singleGroup = document.getElementById('singleGroup');
    const singleLogo = document.getElementById('singleLogo');
    const totalCountSpan = document.getElementById('totalCountBadge');

    function showToast(msg, duration=2800) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, duration);
    }

    // destroy HLS
    function destroyPlayer() {
        if (currentHlsInstance) {
            currentHlsInstance.destroy();
            currentHlsInstance = null;
        }
        video.pause();
        video.removeAttribute('src');
        video.load();
        qualitySelect.disabled = true;
        qualitySelect.innerHTML = '<option value="auto">Auto Quality</option>';
        currentQualityLevels = [];
    }

    // play channel
    function playChannel(channel) {
        if (!channel || !channel.url) return;
        destroyPlayer();
        currentNameSpan.innerText = channel.name;
        const streamUrl = channel.url.trim();
        
        const updateQualitySelector = (levels) => {
            if (levels && levels.length > 1) {
                qualitySelect.disabled = false;
                qualitySelect.innerHTML = '<option value="auto">Auto (最佳)</option>';
                levels.forEach((level, idx) => {
                    const height = level.height ? `${level.height}p` : `bitrate ${Math.round(level.bitrate/1000)}k`;
                    qualitySelect.innerHTML += `<option value="${idx}">${height}</option>`;
                });
                currentQualityLevels = levels;
                qualitySelect.onchange = () => {
                    if (currentHlsInstance) {
                        const val = qualitySelect.value;
                        if (val === 'auto') currentHlsInstance.currentLevel = -1;
                        else currentHlsInstance.currentLevel = parseInt(val);
                    }
                };
            } else {
                qualitySelect.disabled = true;
                qualitySelect.innerHTML = '<option value="auto">Auto (No variants)</option>';
            }
        };

        if (streamUrl.includes('.m3u8') || streamUrl.includes('m3u8') || streamUrl.endsWith('m3u8')) {
            if (Hls.isSupported()) {
                const hls = new Hls({ debug: false, enableWorker: true });
                currentHlsInstance = hls;
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    const levels = hls.levels;
                    updateQualitySelector(levels);
                    video.play().catch(e => showToast("Autoplay blocked, click play", 1500));
                });
                hls.on(Hls.Events.ERROR, (_, err) => {
                    if (err.fatal) showToast(`Stream error: ${channel.name}`, 2000);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => video.play().catch(()=>{}));
                qualitySelect.disabled = true;
            } else {
                showToast("HLS not supported in this browser", 2000);
            }
        } else {
            video.src = streamUrl;
            video.play().catch(()=>showToast("Playback blocked", 1200));
            qualitySelect.disabled = true;
        }
    }

    // লোগো নির্ধারণ helper
    function getDisplayLogo(channel) {
        if (channel.logo && channel.logo.trim() !== "") return channel.logo.trim();
        // fallback: নামের প্রথম অক্ষর
        let first = channel.name.charAt(0).toUpperCase();
        if (/[A-Z0-9]/.test(first)) return first;
        return "📺";
    }

    // localStorage save
    function persistChannels() {
        localStorage.setItem('nistv_channels_v2', JSON.stringify(allChannels));
        renderUI();
    }

    // রেন্ডার ক্যাটাগরি ও চ্যানেল
    function renderUI() {
        totalCountSpan.innerText = `(${allChannels.length})`;
        let groupsMap = new Map();
        groupsMap.set('all', allChannels.length);
        allChannels.forEach(ch => {
            let grp = ch.group || "Uncategorized";
            groupsMap.set(grp, (groupsMap.get(grp) || 0) + 1);
        });
        let sortedGroups = Array.from(groupsMap.keys()).filter(k => k !== 'all').sort();
        if (groupsMap.has('all')) sortedGroups.unshift('all');
        
        let catsHtml = '';
        for (let cat of sortedGroups) {
            let count = groupsMap.get(cat) || 0;
            let activeClass = (activeCategory === cat) ? 'active' : '';
            let displayName = cat === 'all' ? 'All' : cat;
            catsHtml += `<div class="cat-chip ${activeClass}" data-cat="${cat}">${displayName} (${count})</div>`;
        }
        categoriesContainer.innerHTML = catsHtml;
        document.querySelectorAll('.cat-chip').forEach(el => {
            el.addEventListener('click', (e) => {
                activeCategory = el.getAttribute('data-cat');
                renderUI();
            });
        });

        let filtered = allChannels.filter(ch => {
            if (activeCategory !== 'all' && (ch.group || "Uncategorized") !== activeCategory) return false;
            if (searchKeyword.trim() !== "") {
                return ch.name.toLowerCase().includes(searchKeyword.toLowerCase());
            }
            return true;
        });

        if (filtered.length === 0) {
            channelsGrid.innerHTML = `<div class="empty-message"><i class="fas fa-frown"></i> No channels match. Use left panel to add.</div>`;
            return;
        }

        let gridHtml = '';
        filtered.forEach(ch => {
            const logoText = getDisplayLogo(ch);
            const groupDisplay = ch.group || "General";
            gridHtml += `
                <div class="channel-card" data-id="${ch.id}" data-url="${escapeAttr(ch.url)}" data-name="${escapeAttr(ch.name)}" data-group="${escapeAttr(groupDisplay)}">
                    <div class="channel-logo">${escapeHtml(logoText.length > 2 ? logoText.substring(0,2) : logoText)}</div>
                    <div class="channel-details">
                        <div class="channel-name">${escapeHtml(ch.name)}</div>
                        <div class="channel-group"><i class="fas fa-tag"></i> ${escapeHtml(groupDisplay)}</div>
                    </div>
                </div>
            `;
        });
        channelsGrid.innerHTML = gridHtml;
        document.querySelectorAll('.channel-card').forEach(card => {
            card.addEventListener('click', () => {
                const url = card.getAttribute('data-url');
                const name = card.getAttribute('data-name');
                const group = card.getAttribute('data-group');
                if (url) playChannel({ url: url, name: name, group: group });
            });
        });
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function escapeAttr(str) { return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

    // M3U পার্সার
    function parseM3U(content) {
        const lines = content.split(/\r?\n/);
        const channels = [];
        let i = 0;
        while (i < lines.length) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF')) {
                let attrs = {};
                const attrRegex = /(\w+(?:-\w+)?)="([^"]*)"/g;
                let match;
                while ((match = attrRegex.exec(line)) !== null) attrs[match[1]] = match[2];
                let channelName = "";
                const lastComma = line.lastIndexOf(',');
                if (lastComma !== -1) channelName = line.substring(lastComma+1).trim();
                if (!channelName && attrs['tvg-name']) channelName = attrs['tvg-name'];
                if (!channelName) channelName = "Unnamed";
                const group = attrs['group-title'] || "Uncategorized";
                const logo = attrs['tvg-logo'] || "";
                let urlLine = "";
                let j = i+1;
                while (j < lines.length) {
                    let next = lines[j].trim();
                    if (next && !next.startsWith('#')) {
                        urlLine = next;
                        break;
                    }
                    j++;
                }
                if (urlLine) {
                    channels.push({
                        id: crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random(),
                        name: channelName,
                        url: urlLine,
                        group: group,
                        logo: logo ? (logo.length>2 ? logo.substring(0,2) : logo) : ""
                    });
                }
                i = j;
            } else { i++; }
        }
        return channels;
    }

    function importChannels(newChannels, mergeMode) {
        if (!newChannels.length) { showToast("No channels found", 1500); return false; }
        if (mergeMode === 'merge') {
            const existingUrls = new Set(allChannels.map(c => c.url));
            const added = newChannels.filter(ch => !existingUrls.has(ch.url));
            allChannels = [...allChannels, ...added];
            showToast(`Merged ${added.length} new. Total: ${allChannels.length}`, 2500);
        } else {
            allChannels = [...newChannels];
            showToast(`Replaced with ${allChannels.length} channels.`, 2500);
        }
        persistChannels();
        return true;
    }

    function processM3uText(text, mergeMode) {
        if (!text.trim()) return;
        const channels = parseM3U(text);
        if (channels.length === 0) showToast("No valid EXTINF entries", 1800);
        else importChannels(channels, mergeMode);
    }

    async function fetchRemotePlaylist(url, mergeMode) {
        if (!url) return;
        try {
            showToast("Fetching remote M3U...");
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.text();
            processM3uText(data, mergeMode);
        } catch(e) { showToast("Fetch error: CORS or invalid link", 3000); }
    }

    function loadLocalFile(file, mergeMode) {
        const reader = new FileReader();
        reader.onload = (e) => processM3uText(e.target.result, mergeMode);
        reader.onerror = () => showToast("File read error");
        reader.readAsText(file, "UTF-8");
    }

    function addSingleChannel() {
        let name = singleName.value.trim();
        let url = singleUrl.value.trim();
        let group = singleGroup.value.trim() || "General";
        let logo = singleLogo.value.trim();
        if (!name || !url) { showToast("Channel name and URL required", 1500); return; }
        if (!url.startsWith('http')) { showToast("URL must start with http/https", 1500); return; }
        const newChannel = {
            id: crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random(),
            name: name,
            url: url,
            group: group,
            logo: logo || ""
        };
        allChannels.push(newChannel);
        persistChannels();
        singleName.value = ''; singleUrl.value = ''; singleGroup.value = ''; singleLogo.value = '';
        showToast(`Added: ${name}`, 1500);
    }

    function resetAllData() {
        if (confirm("⚠️ PERMANENT: Delete all stored channels? This cannot be undone.")) {
            allChannels = [];
            persistChannels();
            destroyPlayer();
            currentNameSpan.innerText = "— No channel —";
            showToast("All channels cleared", 1500);
        }
    }

    function getMergeMode() {
        const radios = document.getElementsByName('mergeModeRadio');
        for (let r of radios) if (r.checked) return r.value;
        return 'replace';
    }

    // ---------- স্থায়ী লিংক (হার্ডকোডেড) যোগ করা হলো ----------
    function loadStored() {
        const stored = localStorage.getItem('nistv_channels_v2');
        if (stored) {
            try {
                allChannels = JSON.parse(stored);
                if (allChannels.length) showToast(`Loaded ${allChannels.length} channels`, 1800);
                else {
                    // যদি localStorage ফাঁকা থাকে তাহলে ডিফল্ট চ্যানেল বসাও
                    setDefaultChannels();
                }
            } catch(e) { setDefaultChannels(); }
        } else {
            setDefaultChannels();
        }
        renderUI();
    }

    function setDefaultChannels() {
        // এখানে আপনার পছন্দের স্থায়ী http/https m3u8 লিংক দিন
        allChannels = [
            {
                id: crypto.randomUUID(),
                name: "T Sports",
                url: "http://198.195.239.50:8095/Tsports/tracks-v1a1/mono.m3u8",   // Replace with real URL
                group: "Sports",
                logo: "📺"
            },
            {
                id: crypto.randomUUID(),
                name: "ATN Bangla HD",
                url: "https://sample-streams.com/atn.m3u8",
                group: "Bangla",
                logo: "A"
            },
            {
                id: crypto.randomUUID(),
                name: "Discovery Hindi",
                url: "https://sample-streams.com/discovery.m3u8",
                group: "Documentary",
                logo: "D"
            },
            {
                id: crypto.randomUUID(),
                name: "Love Nature 4K",
                url: "https://sample-streams.com/lovenature.m3u8",
                group: "Documentary",
                logo: "🌿"
            },
            {
                id: crypto.randomUUID(),
                name: "News18 Bangla",
                url: "https://sample-streams.com/news18.m3u8",
                group: "News",
                logo: "📰"
            },
            {
                id: crypto.randomUUID(),
                name: "Saudi Quran Live",
                url: "https://sample-streams.com/quran.m3u8",
                group: "Religions",
                logo: "🕌"
            },
            {
                id: crypto.randomUUID(),
                name: "Sports 24/7",
                url: "https://sample-streams.com/sports.m3u8",
                group: "Sports",
                logo: "⚽"
            }
        ];
        persistChannels();  // সেভ করে দেবে
        showToast(`${allChannels.length} default channels added. You can edit or add more.`, 3000);

    // ইভেন্ট লিসেনার
    fetchM3uBtn.addEventListener('click', () => {
        const url = m3uUrlInput.value.trim();
        if (url) fetchRemotePlaylist(url, getMergeMode());
        else showToast("Enter playlist URL", 1200);
    });
    triggerFileBtn.addEventListener('click', () => fileUploader.click());
    fileUploader.addEventListener('change', (e) => {
        if (e.target.files.length) loadLocalFile(e.target.files[0], getMergeMode());
        e.target.value = '';
    });
    addSingleBtn.addEventListener('click', addSingleChannel);
    resetBtn.addEventListener('click', resetAllData);
    searchInput.addEventListener('input', (e) => { searchKeyword = e.target.value; renderUI(); });

    loadStored();
</script>
</body>
