<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাইভ টিভি হোস্ٹنگ - Vercel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0f0f12; color: #fff; font-family: Arial, sans-serif; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 15px; }
        .player-wrapper { width: 100%; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        video { width: 100%; display: block; }
        .channel-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .channel-btn { background: #1f1f27; border: 1px solid #333; color: #fff; padding: 14px; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        .channel-btn:hover { background: #ff0055; border-color: #ff0055; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ফ্রি লাইভ টিভি প্লেয়ার</h2>
        <div class="player-wrapper">
            <video id="player" controls crossorigin playsinline></video>
        </div>

        <h3>চ্যানেল লিস্ট</h3>
        <div class="channel-list">
            <button class="channel-btn" onclick="playM3U8('http://198.195.239.50:8095/Tsports/tracks-v1a1/mono.m3u8')">T-Sports</button>
            <button class="channel-btn" onclick="playM3U8('আপনার_অন্য_লিংক_এখানে')">চ্যানেল ২</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('player');
        let hls = new Hls();

        function playM3U8(url) {
            console.log("Direct Loading URL:", url);

            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                    video.play().catch(function(error) {
                        console.log("Autoplay blocked, waiting for user interaction.");
                    }); 
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { video.play(); });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new Plyr(video, { controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] });
            // সাইট ওপেন হলে অটোমেটিক T-Sports লিংকটি লোড হবে
            playM3U8('http://198.195.239.50:8095/Tsports/tracks-v1a1/mono.m3u8');
        });
    </script>
</body>
</html>
