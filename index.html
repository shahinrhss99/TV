<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ফ্রি আইপিটিভি হোস্টিং</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0f0f12; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; }
        .container { max-width: 900px; margin: 20px auto; padding: 15px; }
        .player-wrapper { width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); background: #000; margin-bottom: 25px; }
        video { width: 100%; display: block; }
        .channel-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 10px; }
        .channel-btn { background: #1f1f27; border: 1px solid #333; color: #fff; padding: 14px; cursor: pointer; border-radius: 8px; transition: 0.2s ease; font-size: 14px; font-weight: bold; }
        .channel-btn:hover { background: #ff0055; border-color: #ff0055; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <h2>ফ্রি লাইভ টিভি প্লেয়ার (Advanced HLS)</h2>
        
        <div class="player-wrapper">
            <video id="player" controls crossorigin playsinline></video>
        </div>

        <h3>চ্যানেল লিস্ট</h3>
        <div class="channel-list">
            <button class="channel-btn" onclick="playM3U8('https://edge2.roarzone.net:8447/roarzone/edge2/tsports/tracks-v1a1/mono.m3u8?token=5423c34a04dde8d5fcf3669a63893a0aee7df055-e50372038c892c401224cb2d7b633a47-1779636978-1779626178')">T Sports</button>
            <button class="channel-btn" onclick="playM3U8('http://198.195.239.50:8095/StarSportsSelect1/tracks-v1a1/mono.m3u8২')">/Star Sports Select 1</button>
            <button class="channel-btn" onclick="playM3U8('http://198.195.239.50:8095/SonyTenSports2/tracks-v1a1/mono.m3u8')">Sony Ten Sports 2</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('player');
        let hls = new Hls();
        let player;

        // চ্যানেল প্লে করার মেইন ফাংশন
        function playM3U8(url) {
            // যদি ব্রাউজার HLS সাপোর্ট করে (যেমন ক্রোম, ফায়ারফক্স ইত্যাদি)
            if (Hls.isSupported()) {
                hls.destroy(); // আগের স্ট্রিম বন্ধ করা
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } 
            // যদি ব্রাউজারে বিল্ট-ইন সাপোর্ট থাকে (যেমন আইফোন বা সাফারী ব্রাউজার)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        // সাইট লোড হলে প্রথম ডেমো চ্যানেলটি অটোমেটিক সেট হবে
        document.addEventListener('DOMContentLoaded', () => {
            player = new Plyr(video, { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] });
            playM3U8('http://198.195.239.50:8095/Tsports/tracks-v1a1/mono.m3u8');
        });
    </script>
</body>
</html>
