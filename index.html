<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Live Free TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- HLS.js library for m3u8 playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --accent: #ff0055;
            --text: #fff;
            --hover: #2a2a2a;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Player section */
        .player-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            background: #000;
            padding: 20px;
            gap: 15px;
            box-sizing: border-box;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            aspect-ratio: 16 / 9;
            width: 100%;
        }

        #video-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        .video-info h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        /* Sidebar */
        .sidebar {
            flex: 1;
            min-width: 350px;
            background: var(--card);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255,255,255,.1);
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        #channel-search {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,.05);
            color: #fff;
            margin-bottom: 15px;
            outline: none;
            font-size: 1rem;
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cat-tab {
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,.08);
            color: #fff;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-tab.active {
            background: var(--accent);
        }

        .channel-list {
            list-style: none;
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            overflow-y: auto;
            align-content: start;
            flex: 1;
        }

        .channel-item {
            background: rgba(255,255,255,.04);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            border: 2px solid transparent;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .channel-item:hover {
            background: var(--hover);
        }

        .channel-item.active {
            border-color: var(--accent);
            background: rgba(255,0,85,0.05);
        }

        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin-bottom: 8px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 8px;
        }

        .channel-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: #ddd;
            text-align: center;
            word-break: break-word;
            max-width: 100%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        @media (max-width: 992px) {
            body, html {
                overflow: auto;
                height: auto;
            }
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                min-width: 100%;
                height: auto;
            }
            .player-section {
                flex: none;
            }
            .channel-list {
                overflow-y: visible;
            }
        }

        /* Error / loading state */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            z-index: 10;
            backdrop-filter: blur(4px);
            border-radius: 16px;
        }
    </style>
</head>
<body>

  { name: "Maasranga TV", category: "Bangla", logo: "https://raw.githubusercontent.com/subirkumarpaul/Logo/main/Maasranga%20TV.png", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1722/output/1722.m3u8" }

    // ------------------------------
    // 2. DOM elements and variables
    // ------------------------------
    const listBar = document.getElementById("listbar");
    const titleEl = document.getElementById("now-playing-title");
    const videoPlayer = document.getElementById("video-player");
    const searchInput = document.getElementById("channel-search");
    const catTabs = document.querySelectorAll(".cat-tab");

    let activeCategory = "all";
    let currentChannel = null;
    let hls = null; // HLS instance

    // Helper: destroy HLS if exists
    function destroyHls() {
        if (hls) {
            hls.destroy();
            hls = null;
        }
    }

    // Load m3u8 using HLS.js or native if supported
    function loadM3U8(url) {
        // remove any loading overlay if present
        const existingOverlay = document.querySelector(".loading-overlay");
        if(existingOverlay) existingOverlay.remove();

        // Show loading indicator
        const container = document.getElementById("video-container");
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "loading-overlay";
        loadingDiv.innerText = "Loading stream...";
        container.appendChild(loadingDiv);

        // Stop current playback
        videoPlayer.pause();
        destroyHls();

        // Check for native HLS support (Safari)
        if (videoPlayer.canPlayType("application/vnd.apple.mpegurl")) {
            videoPlayer.src = url;
            videoPlayer.addEventListener('loadedmetadata', () => {
                loadingDiv.remove();
                videoPlayer.play().catch(e => console.warn("Autoplay prevented:", e));
            }, { once: true });
            videoPlayer.addEventListener('error', () => {
                if(loadingDiv) loadingDiv.remove();
                alert("Cannot play this stream. Check URL or network.");
            }, { once: true });
        } 
        else if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30,
            });
            hls.loadSource(url);
            hls.attachMedia(videoPlayer);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                if(loadingDiv) loadingDiv.remove();
                videoPlayer.play().catch(e => console.warn("Autoplay blocked:", e));
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.error("Network error, trying to recover");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.error("Media error, recovering");
                            hls.recoverMediaError();
                            break;
                        default:
                            destroyHls();
                            if(loadingDiv) loadingDiv.remove();
                            alert("Cannot play stream. Invalid m3u8 or network issue.");
                            break;
                    }
                } else if (loadingDiv) {
                    // non-fatal, maybe still loading
                }
            });
        } 
        else {
            if(loadingDiv) loadingDiv.remove();
            alert("HLS not supported in this browser.");
        }
    }

    // Render channel list
    function renderChannels(filterText = "") {
        listBar.innerHTML = "";
        const filtered = channelsData.filter(ch => {
            const matchName = ch.name.toLowerCase().includes(filterText.toLowerCase());
            const matchCat = activeCategory === "all" || ch.category === activeCategory;
            return matchName && matchCat;
        });

        filtered.forEach(ch => {
            const li = document.createElement("li");
            li.className = "channel-item";
            if (currentChannel && currentChannel.name === ch.name) li.classList.add("active");
            li.setAttribute("data-name", ch.name.toLowerCase());
            li.setAttribute("data-category", ch.category);
            li.innerHTML = `
                <div class="logo-wrapper">
                    <img src="${ch.logo}" class="channel-logo" alt="${ch.name}" onerror="this.src='https://placehold.co/80x80?text=No+Logo'">
                </div>
                <div class="channel-name">${ch.name}</div>
            `;
            li.onclick = () => {
                // change channel
                currentChannel = ch;
                titleEl.innerText = ch.name;
                loadM3U8(ch.url);
                // update active class
                document.querySelectorAll(".channel-item").forEach(item => item.classList.remove("active"));
                li.classList.add("active");
                if (window.innerWidth < 992) window.scrollTo({ top: 0, behavior: "smooth" });
            };
            listBar.appendChild(li);
        });

        if (filtered.length === 0) {
            const emptyMsg = document.createElement("div");
            emptyMsg.style.padding = "20px";
            emptyMsg.style.textAlign = "center";
            emptyMsg.style.color = "#aaa";
            emptyMsg.innerText = "No channels found";
            listBar.appendChild(emptyMsg);
        }
    }

    // Search & filter
    function filterChannels() {
        const query = searchInput.value;
        renderChannels(query);
    }

    // Category click
    catTabs.forEach(tab => {
        tab.addEventListener("click", () => {
            catTabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            activeCategory = tab.getAttribute("data-type");
            filterChannels();
        });
    });

    searchInput.addEventListener("input", filterChannels);

    // initial load: default channel (TSports HD)
    function init() {
        renderChannels();
        // Auto-select first channel (TSports HD) and play
        const firstChannel = channelsData.find(ch => ch.name === "TSports HD") || channelsData[0];
        if (firstChannel) {
            currentChannel = firstChannel;
            titleEl.innerText = firstChannel.name;
            loadM3U8(firstChannel.url);
            // mark active
            const items = document.querySelectorAll(".channel-item");
            if(items.length) items[0].classList.add("active");
        }
    }

    init();

    // Optional: handle visibility change to pause/resume HLS when tab hidden (saves bandwidth)
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            if (hls) hls.stopLoad();
            videoPlayer.pause();
        } else {
            if (hls) hls.startLoad();
            videoPlayer.play().catch(e => {});
        }
    });
</script>
